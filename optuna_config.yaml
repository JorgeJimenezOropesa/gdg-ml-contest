# All study settings live here. The Python entry point only needs --config.
data:
  train: data/train_split.npz
  validation: data/val_split.npz

runtime:
  seed: 42
  device: auto # auto, cpu, or cuda
  num_workers: 2

study:
  name: convnet-exam
  storage: sqlite:///optuna.db
  load_if_exists: true
  direction: maximize
  n_trials: 200
  timeout: null
  gc_after_trial: true
  sampler:
    name: tpe
    seed: 42
    multivariate: true
    n_startup_trials: 20
  pruner:
    name: hyperband
    min_resource: 2
    max_resource: 30
    reduction_factor: 3

training:
  epochs: 30
  optimizer: adamw
  scheduler:
    name: onecycle
    pct_start: 0.2
    anneal_strategy: cos

evaluation:
  exam_time_budget: 60.0

output:
  directory: optuna_results
  best_config: best_optuna_config.json

search:
  architecture:
    in_channels: 4
    num_classes: 8
    n_stages:
      type: int
      low: 3
      high: 5
    stem_channels:
      type: categorical
      choices: [24, 32, 48, 64, 80, 96, 128]
    stem_kernel_size:
      type: categorical
      choices: [3, 5, 7, 9]
    dense_hidden_dim:
      type: categorical
      choices: [24, 32, 48, 64, 80, 96, 128]
    stage:
      res_kernel_size:
        type: categorical
        choices: [3, 5, 7, 9]
      down_kernel_size:
        type: categorical
        choices: [3, 5, 7]
      num_blocks:
        type: int
        low: 1
        high: 4
      out_channels:
        type: categorical
        choices: [24, 32, 48, 64, 80, 96, 128]
  training:
    batch_size:
      type: categorical
      choices: [64, 128, 256]
    learning_rate:
      type: float
      low: 0.0001
      high: 0.005
      log: true
    weight_decay:
      type: float
      low: 0.000001
      high: 0.05
      log: true
    label_smoothing:
      type: float
      low: 0.0
      high: 0.2